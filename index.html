<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>教室借用系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      // Firebase 設定
      // const firebaseConfig = {
      //   apiKey: "999253388381",
      //   authDomain: "xingdexangdeclassroom.firebaseapp.com",
      //   projectId: "xingdexangdeclassroom",
      // };
      // // 初始化 Firebase
      // firebase.initializeApp(firebaseConfig);
      // const db = firebase.firestore();
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
      #version-badge {
        position: fixed;
        top: 16px;
        right: 24px;
        background: #6366f1;
        color: #fff;
        font-size: 0.85rem;
        font-weight: bold;
        border-radius: 999px;
        padding: 2px 10px;
        z-index: 9999;
        box-shadow: 0 2px 8px rgba(99,102,241,0.12);
        opacity: 0.85;
        pointer-events: none;
      }
    </style>
</head>
<body>
    <div id="version-badge">v5</div>
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-indigo-800 mb-4 md:mb-0">教室借用系統</h1>
                <div class="flex items-center space-x-4">
                    <button id="prevMonth" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md">
                        上個月
                    </button>
                    <h2 id="currentMonthYear" class="text-xl font-semibold text-gray-700 w-40 text-center"></h2>
                    <button id="nextMonth" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md">
                        下個月
                    </button>
                </div>
            </div>

            <div class="mb-6">
                <div class="flex flex-wrap mb-2">
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #ffcdd2;"></div>
                            <span>晑德-佛堂</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #c8e6c9;"></div>
                            <span>晑德-廚房</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #bbdefb;"></div>
                            <span>晑德-多功能教室</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #d1c4e9;"></div>
                            <span>晑德-會談室</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #ffe0b2;"></div>
                            <span>杏德-佛堂</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #b2dfdb;"></div>
                            <span>杏德-坤伙</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-7 gap-1 mb-2 text-center font-semibold bg-gray-100 p-2 rounded">
                <div>週日</div>
                <div>週一</div>
                <div>週二</div>
                <div>週三</div>
                <div>週四</div>
                <div>週五</div>
                <div>週六</div>
            </div>

            <div id="calendar" class="grid grid-cols-7 gap-1"></div>
        </div>
    </div>

    <!-- 新增活動表單 -->
    <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 id="eventModalTitle" class="text-xl font-bold mb-4">新增活動</h3>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">日期</label>
                <input type="text" id="eventDate" class="w-full p-2 border rounded" readonly>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">活動名稱</label>
                <input type="text" id="eventTitle" class="w-full p-2 border rounded" placeholder="請輸入活動名稱">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">主辦單位</label>
                <div class="flex space-x-4">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="eventHostType" value="學界" class="host-radio mr-2">學界
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="eventHostType" value="社會界" class="host-radio mr-2">社會界
                    </label>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">時間</label>
                <div class="flex space-x-2">
                    <input type="time" id="eventStartTime" class="w-1/2 p-2 border rounded">
                    <span class="flex items-center">至</span>
                    <input type="time" id="eventEndTime" class="w-1/2 p-2 border rounded">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">場地（可複選）</label>
                <div id="venueSelector" class="grid grid-cols-2 gap-2">
                    <!-- 場地選項將由 JavaScript 動態生成 -->
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">負責人</label>
                <input type="text" id="eventOrganizer" class="w-full p-2 border rounded mb-2" placeholder="請輸入負責人姓名">
                <input type="tel" id="eventOrganizerPhone" class="w-full p-2 border rounded" placeholder="請輸入負責人電話">
            </div>
            <div class="flex justify-end space-x-2">
                <button id="cancelEvent" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">取消</button>
                <button id="saveEvent" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">儲存</button>
            </div>
        </div>
    </div>

    <!-- 查看活動詳情 -->
    <div id="viewEventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">活動詳情</h3>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">活動名稱</label>
                <p id="viewEventTitle" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">主辦單位</label>
                <p id="viewEventHostType" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">日期</label>
                <p id="viewEventDate" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">時間</label>
                <p id="viewEventTime" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">場地</label>
                <p id="viewEventVenue" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">負責人</label>
                <p id="viewEventOrganizer" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">電話</label>
                <p id="viewEventOrganizerPhone" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="flex flex-col space-y-2">
                <button id="editEvent" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded">編輯</button>
                <button id="deleteEvent" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">刪除</button>
                <button id="closeViewEvent" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">關閉</button>
            </div>
        </div>
    </div>
    
    <!-- 匯入資料對話框 -->
    <div id="importModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">匯入資料</h3>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">請貼上之前匯出的 JSON 資料</label>
                <textarea id="importDataText" class="w-full p-2 border rounded h-40" placeholder="貼上 JSON 資料..."></textarea>
            </div>
            <div class="flex justify-end space-x-2">
                <button id="cancelImport" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">取消</button>
                <button id="confirmImport" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">匯入</button>
            </div>
        </div>
    </div>
    
    <!-- 提示訊息 -->
    <div id="toast" class="toast"></div>

    <script src="main.js"></script>
</body>
</html>
