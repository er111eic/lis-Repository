<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>杏德晑德空間借用系統</title>
    <link rel="stylesheet" href="dist/tailwind.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>

      // const firebaseConfig = {

      //   authDomain: "xingdexangdeclassroom.firebaseapp.com",
      //   projectId: "xingdexangdeclassroom",
      // };
      // // 初始化 Firebase
      // firebase.initializeApp(firebaseConfig);
      // const db = firebase.firestore();
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
      #version-badge {
        position: fixed;
        top: 16px;
        right: 24px;
        background: #6366f1;
        color: #fff;
        font-size: 0.85rem;
        font-weight: bold;
        border-radius: 999px;
        padding: 2px 10px;
        z-index: 9999;
        box-shadow: 0 2px 8px rgba(99,102,241,0.12);
        opacity: 0.85;
        pointer-events: none;
      }
    </style>
</head>
<body>
    <header class="container mx-auto px-4 py-4 max-w-6xl">
        <h1 class="text-3xl font-extrabold text-indigo-800 mb-4 md:mb-0 modal-title tracking-tight drop-shadow-sm" style="letter-spacing:0.04em;">杏德晑德空間借用系統</h1>
    </header>
    <main>
        <section class="container mx-auto px-4 py-8 max-w-6xl">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6">
                    <div class="flex items-center space-x-4">
                        <button id="prevMonth" class="btn-primary btn-icon"><span class="icon">&#8592;</span></button>
                        <h2 id="currentMonthYear" class="text-xl font-semibold text-gray-700 w-40 text-center"></h2>
                        <button id="nextMonth" class="btn-primary btn-icon"><span class="icon">&#8594;</span></button>
                    </div>
                </div>

                <div class="mb-6">
                    <div class="flex flex-wrap mb-2">
                        <div class="w-full md:w-1/3 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-4 h-4 rounded mr-2" style="background-color: #ffcdd2;"></div>
                                <span>晑德-佛堂</span>
                            </div>
                        </div>
                        <div class="w-full md:w-1/3 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-4 h-4 rounded mr-2" style="background-color: #c8e6c9;"></div>
                                <span>晑德-廚房</span>
                            </div>
                        </div>
                        <div class="w-full md:w-1/3 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-4 h-4 rounded mr-2" style="background-color: #bbdefb;"></div>
                                <span>晑德-多功能教室</span>
                            </div>
                        </div>
                        <div class="w-full md:w-1/3 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-4 h-4 rounded mr-2" style="background-color: #d1c4e9;"></div>
                                <span>晑德-會談室</span>
                            </div>
                        </div>
                        <div class="w-full md:w-1/3 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-4 h-4 rounded mr-2" style="background-color: #ffe0b2;"></div>
                                <span>杏德-佛堂</span>
                            </div>
                        </div>
                        <div class="w-full md:w-1/3 px-2 mb-2">
                            <div class="flex items-center">
                                <div class="w-4 h-4 rounded mr-2" style="background-color: #b2dfdb;"></div>
                                <span>杏德-坤伙</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-1 mb-2 text-center font-semibold bg-gray-100 p-2 rounded">
                    <div>週日</div>
                    <div>週一</div>
                    <div>週二</div>
                    <div>週三</div>
                    <div>週四</div>
                    <div>週五</div>
                    <div>週六</div>
                </div>

                <div id="calendar" class="grid grid-cols-7 gap-1"></div>
            </div>
        </section>
    </main>

    <!-- 新增活動表單 Modal -->
    <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
        <form class="bg-white rounded-lg p-6 w-full max-w-md" autocomplete="off" onsubmit="return false;">
            <h3 id="eventModalTitle" class="text-xl font-bold mb-4 modal-title">新增活動</h3>
            <!-- Accordion Step 1：基本資訊 -->
            <div class="accordion-step" id="accordionStep1">
                <button type="button" class="accordion-header w-full text-left py-3 px-2 font-bold text-lg border-b focus:outline-none" aria-expanded="true">Step 1：基本資訊 ▼</button>
                <div class="accordion-content p-2">
                    <div class="mb-2 flex flex-row items-center gap-4">
                        <label for="eventDate" class="block text-gray-700 mb-1 whitespace-nowrap">日期</label>
                        <input type="text" id="eventDate" class="w-full p-2 border rounded" readonly required style="max-width: 180px;">
                        <div class="text-xs text-red-500 mt-1 flex-1" id="eventDateError"></div>
                    </div>
                    <div class="mb-2 flex flex-row items-center gap-4">
                        <label for="eventTitle" class="block text-gray-700 mb-1 whitespace-nowrap">活動名稱<span class="text-red-500">*</span></label>
                        <input type="text" id="eventTitle" class="w-full p-2 border rounded" placeholder="請輸入活動名稱" required style="max-width: 180px;">
                        <div class="text-xs text-red-500 mt-1 flex-1" id="eventTitleError"></div>
                    </div>
                    <div class="mb-2 flex flex-row items-center gap-4">
                        <label class="block text-gray-700 mb-1 whitespace-nowrap">主辦單位<span class="text-red-500">*</span></label>
                        <label class="inline-flex items-center mr-4"><input type="radio" name="eventHostType" value="學界" class="host-radio mr-2" required>學界</label>
                        <label class="inline-flex items-center"><input type="radio" name="eventHostType" value="社會界" class="host-radio mr-2" required>社會界</label>
                        <div class="text-xs text-red-500 mt-1 flex-1" id="eventHostTypeError"></div>
                    </div>
                    <div class="mb-2 flex items-center">
                        <label for="eventStartTime" class="block text-gray-700 mr-2">時間</label>
                        <input type="time" id="eventStartTime" class="p-2 border rounded w-28" required>
                        <span class="mx-2">~</span>
                        <input type="time" id="eventEndTime" class="p-2 border rounded w-28" required>
                    </div>
                    <div class="flex">
                        <div class="text-xs text-red-500 mt-1 flex-1" id="eventStartTimeError"></div>
                        <div class="text-xs text-red-500 mt-1 flex-1" id="eventEndTimeError"></div>
                    </div>
                </div>
            </div>
            <!-- Accordion Step 2：地點選擇 -->
            <div class="accordion-step" id="accordionStep2">
                <button type="button" class="accordion-header w-full text-left py-3 px-2 font-bold text-lg border-b focus:outline-none" aria-expanded="true">Step 2：地點選擇 ▼</button>
                <div class="accordion-content p-2">
                    <div id="venueSelector" class="grid grid-cols-3 gap-2"></div>
                    <div class="text-xs text-red-500 mt-1" id="venueSelectorError"></div>
                </div>
            </div>
            <!-- Accordion Step 3：負責人資訊 -->
            <div class="accordion-step" id="accordionStep3">
                <button type="button" class="accordion-header w-full text-left py-3 px-2 font-bold text-lg border-b focus:outline-none" aria-expanded="true">Step 3：負責人資訊 ▼</button>
                <div class="accordion-content p-2">
                    <div class="mb-2 flex flex-row items-center gap-4">
                        <label for="eventOrganizer" class="block text-gray-700 mb-1 whitespace-nowrap">姓名<span class="text-red-500">*</span></label>
                        <input type="text" id="eventOrganizer" class="w-full p-2 border rounded" required style="max-width: 180px;">
                        <label for="eventOrganizerPhone" class="block text-gray-700 mb-1 ml-4 whitespace-nowrap">電話<span class="text-red-500">*</span></label>
                        <input type="tel" id="eventOrganizerPhone" class="w-full p-2 border rounded" required style="max-width: 180px;">
                    </div>
                    <div class="flex flex-row gap-4">
                        <div class="text-xs text-red-500 mt-1 flex-1" id="eventOrganizerError"></div>
                        <div class="text-xs text-red-500 mt-1 flex-1" id="eventOrganizerPhoneError"></div>
                    </div>
                </div>
            </div>
            <!-- Accordion底部按鈕 -->
            <div class="flex justify-center space-x-4 mt-6">
                <button id="cancelEvent" class="btn-secondary btn-icon" type="button"><span class="icon">✖️</span>取消</button>
                <button id="saveEvent" class="btn-primary btn-icon" type="submit"><span class="icon">＋</span>儲存</button>
            </div>
        </form>
    </div>

    <!-- 查看活動詳情 -->
    <div id="viewEventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md" style="backdrop-filter: blur(12px); border: 1.5px solid #e5e7eb;">
            <h3 class="text-xl font-bold mb-6 text-gray-800 flex items-center gap-2"><span class="icon" style="color:#6366f1;">📋</span>活動詳情</h3>
            <div class="event-detail-content mb-6"></div>
            <div class="flex flex-row justify-center gap-3 mt-4">
                <button id="editEvent" class="btn-apple-edit flex-1 min-w-0"><span class="icon">✏️</span>編輯</button>
                <button id="deleteEvent" class="btn-apple-delete flex-1 min-w-0"><span class="icon">🗑️</span>刪除</button>
                <button id="closeViewEvent" class="btn-apple-cancel flex-1 min-w-0"><span class="icon">✖️</span>關閉</button>
            </div>
        </div>
    </div>
    
    <!-- 匯入資料對話框 -->
    <div id="importModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">匯入資料</h3>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">請貼上之前匯出的 JSON 資料</label>
                <textarea id="importDataText" class="w-full p-2 border rounded h-40" placeholder="貼上 JSON 資料..."></textarea>
            </div>
            <div class="flex justify-end space-x-2">
                <button id="cancelImport" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">取消</button>
                <button id="confirmImport" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">匯入</button>
            </div>
        </div>
    </div>
    
    <!-- 提示訊息 -->
    <div id="toast" class="toast"></div>

    <script src="main.js"></script>
</body>
</html>
