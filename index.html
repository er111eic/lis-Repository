<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室借用系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      // Firebase 設定
      const firebaseConfig = {
        apiKey: "999253388381",
        authDomain: "xingdexangdeclassroom.firebaseapp.com",
        projectId: "xingdexangdeclassroom",
      };
      // 初始化 Firebase
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
    </script>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: #f0f4f8;
        }
        .calendar-day {
            min-height: 100px;
            transition: all 0.2s;
        }
        .calendar-day:hover {
            background-color: #e6f7ff;
        }
        .event {
            border-radius: 4px;
            margin-bottom: 2px;
            padding: 2px 4px;
            font-size: 0.8rem;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .venue-晑德-佛堂 { background-color: #ffcdd2; }
        .venue-晑德-廚房 { background-color: #c8e6c9; }
        .venue-晑德-多功能教室 { background-color: #bbdefb; }
        .venue-晑德-會談室 { background-color: #d1c4e9; }
        .venue-杏德-佛堂 { background-color: #ffe0b2; }
        .venue-杏德-坤伙 { background-color: #b2dfdb; }
        
        .venue-booked {
            opacity: 0.5;
            text-decoration: line-through;
        }
        
        .venue-selected {
            border: 2px solid #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.3);
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 4px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        
        .toast.success {
            background-color: #4caf50;
        }
        
        .toast.error {
            background-color: #f44336;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .venue-checkbox {
            accent-color: #6366f1;
            width: 1.1em;
            height: 1.1em;
            margin-right: 0.5em;
        }
        .host-radio {
            accent-color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6">
                <h1 class="text-3xl font-bold text-indigo-800 mb-4 md:mb-0">教室借用系統</h1>
                <div class="flex items-center space-x-4">
                    <button id="prevMonth" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md">
                        上個月
                    </button>
                    <h2 id="currentMonthYear" class="text-xl font-semibold text-gray-700 w-40 text-center"></h2>
                    <button id="nextMonth" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md">
                        下個月
                    </button>
                </div>
            </div>

            <div class="mb-6">
                <div class="flex flex-wrap mb-2">
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #ffcdd2;"></div>
                            <span>晑德-佛堂</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #c8e6c9;"></div>
                            <span>晑德-廚房</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #bbdefb;"></div>
                            <span>晑德-多功能教室</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #d1c4e9;"></div>
                            <span>晑德-會談室</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #ffe0b2;"></div>
                            <span>杏德-佛堂</span>
                        </div>
                    </div>
                    <div class="w-full md:w-1/3 px-2 mb-2">
                        <div class="flex items-center">
                            <div class="w-4 h-4 rounded mr-2" style="background-color: #b2dfdb;"></div>
                            <span>杏德-坤伙</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-7 gap-1 mb-2 text-center font-semibold bg-gray-100 p-2 rounded">
                <div>週日</div>
                <div>週一</div>
                <div>週二</div>
                <div>週三</div>
                <div>週四</div>
                <div>週五</div>
                <div>週六</div>
            </div>

            <div id="calendar" class="grid grid-cols-7 gap-1"></div>
        </div>
    </div>

    <!-- 新增活動表單 -->
    <div id="eventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 id="eventModalTitle" class="text-xl font-bold mb-4">新增活動</h3>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">日期</label>
                <input type="text" id="eventDate" class="w-full p-2 border rounded" readonly>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">活動名稱</label>
                <input type="text" id="eventTitle" class="w-full p-2 border rounded" placeholder="請輸入活動名稱">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">主辦單位</label>
                <div class="flex space-x-4">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="eventHostType" value="學界" class="host-radio mr-2">學界
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" name="eventHostType" value="社會界" class="host-radio mr-2">社會界
                    </label>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">時間</label>
                <div class="flex space-x-2">
                    <input type="time" id="eventStartTime" class="w-1/2 p-2 border rounded">
                    <span class="flex items-center">至</span>
                    <input type="time" id="eventEndTime" class="w-1/2 p-2 border rounded">
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">場地（可複選）</label>
                <div id="venueSelector" class="grid grid-cols-2 gap-2">
                    <!-- 場地選項將由 JavaScript 動態生成 -->
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">負責人</label>
                <input type="text" id="eventOrganizer" class="w-full p-2 border rounded mb-2" placeholder="請輸入負責人姓名">
                <input type="tel" id="eventOrganizerPhone" class="w-full p-2 border rounded" placeholder="請輸入負責人電話">
            </div>
            <div class="flex justify-end space-x-2">
                <button id="cancelEvent" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">取消</button>
                <button id="saveEvent" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">儲存</button>
            </div>
        </div>
    </div>

    <!-- 查看活動詳情 -->
    <div id="viewEventModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">活動詳情</h3>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">活動名稱</label>
                <p id="viewEventTitle" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">主辦單位</label>
                <p id="viewEventHostType" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">日期</label>
                <p id="viewEventDate" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">時間</label>
                <p id="viewEventTime" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">場地</label>
                <p id="viewEventVenue" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">負責人</label>
                <p id="viewEventOrganizer" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold">電話</label>
                <p id="viewEventOrganizerPhone" class="p-2 bg-gray-50 rounded"></p>
            </div>
            <div class="flex flex-col space-y-2">
                <button id="editEvent" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded">編輯</button>
                <button id="deleteEvent" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">刪除</button>
                <button id="closeViewEvent" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">關閉</button>
            </div>
        </div>
    </div>
    
    <!-- 匯入資料對話框 -->
    <div id="importModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">匯入資料</h3>
            <div class="mb-4">
                <label class="block text-gray-700 mb-2">請貼上之前匯出的 JSON 資料</label>
                <textarea id="importDataText" class="w-full p-2 border rounded h-40" placeholder="貼上 JSON 資料..."></textarea>
            </div>
            <div class="flex justify-end space-x-2">
                <button id="cancelImport" class="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">取消</button>
                <button id="confirmImport" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">匯入</button>
            </div>
        </div>
    </div>
    
    <!-- 提示訊息 -->
    <div id="toast" class="toast"></div>

    <script>
        // 全局變數
        let currentDate = new Date();
        let events = {};
        let selectedEventId = null;
        let selectedVenue = null;
        let currentEventDate = null;
        
        // 場地列表
        const venues = [
            "晑德-佛堂",
            "晑德-廚房",
            "晑德-多功能教室",
            "晑德-會談室",
            "杏德-佛堂",
            "杏德-坤伙"
        ];
        
        // 初始化日曆
        function initCalendar() {
            // 從 Firestore 加載事件數據並監聽變化
            loadEvents();
            
            updateMonthYearDisplay();
            renderCalendar();
            
            // 事件監聽
            document.getElementById('prevMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                updateMonthYearDisplay();
                renderCalendar();
            });
            
            document.getElementById('nextMonth').addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                updateMonthYearDisplay();
                renderCalendar();
            });
            
            document.getElementById('cancelEvent').addEventListener('click', closeEventModal);
            document.getElementById('saveEvent').addEventListener('click', saveEvent);
            document.getElementById('closeViewEvent').addEventListener('click', closeViewEventModal);
            document.getElementById('editEvent').addEventListener('click', editEvent);
            document.getElementById('deleteEvent').addEventListener('click', deleteEvent);
            
            // 添加時間變更監聽器
            document.getElementById('eventStartTime').addEventListener('change', updateVenueSelector);
            document.getElementById('eventEndTime').addEventListener('change', updateVenueSelector);
            
            // 匯入對話框
            document.getElementById('cancelImport').addEventListener('click', closeImportModal);
            document.getElementById('confirmImport').addEventListener('click', importData);
        }
        
        // 從 Firestore 加載事件數據並監聽變化
        function loadEvents() {
            db.collection("calendarEvents").onSnapshot((snapshot) => {
                const data = {};
                snapshot.forEach(doc => {
                    data[doc.id] = doc.data().events || [];
                });
                events = data;
                renderCalendar();
            }, (error) => {
                console.error('Error loading events from Firestore:', error);
                showToast('雲端資料載入失敗', 'error');
            });
        }
        
        // 保存事件數據到 Firestore
        function saveEvents() {
            // 依序將每一天的活動寫入 Firestore
            const batch = db.batch();
            for (const date in events) {
                const ref = db.collection("calendarEvents").doc(date);
                batch.set(ref, { events: events[date] });
            }
            // 刪除 Firestore 中已經不存在的日期
            db.collection("calendarEvents").get().then(snapshot => {
                snapshot.forEach(doc => {
                    if (!events[doc.id]) {
                        batch.delete(doc.ref);
                    }
                });
                return batch.commit();
            }).then(() => {
                return true;
            }).catch(error => {
                console.error('Error saving events to Firestore:', error);
                showToast('雲端儲存失敗', 'error');
                return false;
            });
        }
        
        // 更新月份年份顯示
        function updateMonthYearDisplay() {
            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            document.getElementById('currentMonthYear').textContent = `${monthNames[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
        }
        
        // 渲染日曆
        function renderCalendar() {
            const calendarEl = document.getElementById('calendar');
            calendarEl.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // 獲取當月第一天和最後一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            
            // 計算當月第一天是星期幾 (0-6, 0 是星期日)
            const firstDayOfWeek = firstDay.getDay();
            
            // 填充前面的空白日期
            for (let i = 0; i < firstDayOfWeek; i++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day bg-gray-100 p-2 rounded';
                calendarEl.appendChild(dayEl);
            }
            
            // 填充當月日期
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day bg-white border p-2 rounded relative';
                
                // 日期標題
                const dateHeader = document.createElement('div');
                dateHeader.className = 'text-right font-semibold mb-1';
                dateHeader.textContent = day;
                dayEl.appendChild(dateHeader);
                
                // 事件容器
                const eventsContainer = document.createElement('div');
                eventsContainer.className = 'events-container';
                dayEl.appendChild(eventsContainer);
                
                // 添加事件
                const dateStr = formatDateString(year, month + 1, day);
                if (events[dateStr] && Array.isArray(events[dateStr])) {
                    events[dateStr].forEach(event => {
                        if (!event || !event.id) return; // 跳過無效的事件
                        
                        const eventEl = document.createElement('div');
                        let venueText = Array.isArray(event.venues) ? event.venues.map(getVenueShortName).join(',') : getVenueShortName(event.venue);
                        eventEl.className = `event`;
                        eventEl.textContent = `${event.title} (${venueText})`;
                        eventEl.title = `${event.title}\n${venueText}\n${event.startTime}-${event.endTime}`;
                        eventEl.dataset.eventId = event.id;
                        eventEl.addEventListener('click', (e) => {
                            e.stopPropagation();
                            viewEvent(event.id, dateStr);
                        });
                        eventsContainer.appendChild(eventEl);
                    });
                }
                
                // 添加點擊事件
                dayEl.addEventListener('click', () => {
                    openEventModal(dateStr);
                });
                
                calendarEl.appendChild(dayEl);
            }
        }
        
        // 格式化日期字符串 (YYYY-MM-DD)
        function formatDateString(year, month, day) {
            return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
        
        // 獲取場地簡稱
        function getVenueShortName(venue) {
            if (!venue) return '';
            // 從完整場地名稱中提取最後部分作為簡稱
            const parts = venue.split('-');
            return parts[parts.length - 1];
        }
        
        // 打開新增活動表單
        function openEventModal(dateStr, isEdit = false) {
            currentEventDate = dateStr;
            document.getElementById('eventModalTitle').textContent = isEdit ? '編輯活動' : '新增活動';
            document.getElementById('eventDate').value = dateStr;
            
            if (!isEdit) {
                document.getElementById('eventTitle').value = '';
                document.querySelectorAll('input[name="eventHostType"]').forEach(r => r.checked = false);
                document.getElementById('eventStartTime').value = '09:00';
                document.getElementById('eventEndTime').value = '10:00';
                document.getElementById('eventOrganizer').value = '';
                document.getElementById('eventOrganizerPhone').value = '';
                selectedVenues = [];
            }
            
            renderVenueSelector();
            
            document.getElementById('eventModal').classList.remove('hidden');
        }
        
        // 更新場地選擇器（當時間變更時）
        function updateVenueSelector() {
            renderVenueSelector();
        }
        
        // 渲染場地選擇器
        function renderVenueSelector() {
            const dateStr = document.getElementById('eventDate').value;
            const startTime = document.getElementById('eventStartTime').value;
            const endTime = document.getElementById('eventEndTime').value;
            const venueSelector = document.getElementById('venueSelector');
            venueSelector.innerHTML = '';
            venues.forEach(venue => {
                const isBooked = checkVenueBooked(dateStr, venue, startTime, endTime);
                const checked = selectedVenues.includes(venue);
                const venueEl = document.createElement('label');
                venueEl.className = `p-2 border rounded flex items-center cursor-pointer ${isBooked ? 'venue-booked' : ''}`;
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'venue-checkbox';
                checkbox.value = venue;
                checkbox.disabled = isBooked;
                checkbox.checked = checked;
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        selectedVenues.push(venue);
                    } else {
                        selectedVenues = selectedVenues.filter(v => v !== venue);
                    }
                    renderVenueSelector();
                });
                venueEl.appendChild(checkbox);
                const colorMark = document.createElement('div');
                colorMark.className = `w-4 h-4 rounded mr-2`;
                colorMark.style.backgroundColor = getVenueColor(venue);
                venueEl.appendChild(colorMark);
                const venueName = document.createElement('span');
                venueName.textContent = venue;
                venueName.className = 'flex-1';
                venueEl.appendChild(venueName);
                if (isBooked) {
                    const bookedMark = document.createElement('span');
                    bookedMark.textContent = '已預訂';
                    bookedMark.className = 'text-xs text-red-500 ml-1';
                    venueEl.appendChild(bookedMark);
                    venueEl.title = '此場地在所選時間已被預訂';
                }
                venueSelector.appendChild(venueEl);
            });
        }
        
        // 檢查場地是否已被預訂（改進版）
        function checkVenueBooked(dateStr, venue, startTime, endTime) {
            if (!events[dateStr] || !Array.isArray(events[dateStr])) return false;
            
            const newStartMinutes = timeToMinutes(startTime);
            const newEndMinutes = timeToMinutes(endTime);
            
            // 檢查時間是否有效
            if (newStartMinutes >= newEndMinutes) {
                return false; // 無效的時間範圍
            }
            
            return events[dateStr].some(event => {
                if (!event) return false;
                
                // 如果是當前正在編輯的事件，則跳過
                if (selectedEventId && event.id === selectedEventId) return false;
                
                // 如果不是同一個場地，則不衝突
                if (event.venue !== venue) return false;
                
                const existingStartMinutes = timeToMinutes(event.startTime);
                const existingEndMinutes = timeToMinutes(event.endTime);
                
                // 檢查時間是否重疊
                return (
                    (newStartMinutes < existingEndMinutes && newEndMinutes > existingStartMinutes)
                );
            });
        }
        
        // 獲取場地顏色
        function getVenueColor(venue) {
            const colorMap = {
                "晑德-佛堂": "#ffcdd2",
                "晑德-廚房": "#c8e6c9",
                "晑德-多功能教室": "#bbdefb",
                "晑德-會談室": "#d1c4e9",
                "杏德-佛堂": "#ffe0b2",
                "杏德-坤伙": "#b2dfdb"
            };
            return colorMap[venue] || "#e0e0e0";
        }
        
        // 關閉新增活動表單
        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
            selectedEventId = null;
            selectedVenue = null;
            currentEventDate = null;
        }
        
        // 儲存活動
        function saveEvent() {
            const dateStr = document.getElementById('eventDate').value;
            const title = document.getElementById('eventTitle').value.trim();
            const startTime = document.getElementById('eventStartTime').value;
            const endTime = document.getElementById('eventEndTime').value;
            const hostType = document.querySelector('input[name="eventHostType"]:checked')?.value || '';
            const venuesArr = selectedVenues.slice();
            const organizer = document.getElementById('eventOrganizer').value.trim();
            const organizerPhone = document.getElementById('eventOrganizerPhone').value.trim();
            if (!title) { showToast('請輸入活動名稱', 'error'); return; }
            if (!hostType) { showToast('請選擇主辦單位', 'error'); return; }
            if (!startTime || !endTime) { showToast('請輸入活動時間', 'error'); return; }
            if (timeToMinutes(startTime) >= timeToMinutes(endTime)) { showToast('結束時間必須晚於開始時間', 'error'); return; }
            if (!venuesArr.length) { showToast('請選擇場地', 'error'); return; }
            if (!organizer) { showToast('請輸入負責人姓名', 'error'); return; }
            if (!organizerPhone) { showToast('請輸入負責人電話', 'error'); return; }
            // 檢查場地是否已被預訂
            for (const v of venuesArr) {
                if (checkVenueBooked(dateStr, v, startTime, endTime)) {
                    showToast(`${v} 在所選時間已被預訂，請選擇其他場地或時間`, 'error');
                    return;
                }
            }
            // 確保日期對應的事件數組存在
            if (!events[dateStr]) {
                events[dateStr] = [];
            }
            
            if (selectedEventId) {
                // 編輯現有活動
                let found = false;
                
                // 先檢查原日期
                if (events[currentEventDate] && Array.isArray(events[currentEventDate])) {
                    const eventIndex = events[currentEventDate].findIndex(e => e && e.id === selectedEventId);
                    if (eventIndex !== -1) {
                        // 如果日期改變，需要從原日期移除並添加到新日期
                        if (dateStr !== currentEventDate) {
                            // 從原日期移除
                            events[currentEventDate].splice(eventIndex, 1);
                            
                            // 如果原日期沒有活動了，刪除該日期
                            if (events[currentEventDate].length === 0) {
                                delete events[currentEventDate];
                            }
                            
                            // 添加到新日期
                            if (!events[dateStr]) {
                                events[dateStr] = [];
                            }
                            
                            events[dateStr].push({
                                id: selectedEventId,
                                title,
                                startTime,
                                endTime,
                                venues: venuesArr,
                                hostType,
                                organizer,
                                organizerPhone
                            });
                        } else {
                            // 日期沒變，直接更新
                            events[dateStr][eventIndex] = {
                                id: selectedEventId,
                                title,
                                startTime,
                                endTime,
                                venues: venuesArr,
                                hostType,
                                organizer,
                                organizerPhone
                            };
                        }
                        
                        found = true;
                    }
                }
                
                // 如果在原日期找不到，可能是日期已經改變，需要在所有日期中查找
                if (!found) {
                    for (const date in events) {
                        if (!events[date] || !Array.isArray(events[date])) continue;
                        
                        const eventIndex = events[date].findIndex(e => e && e.id === selectedEventId);
                        if (eventIndex !== -1) {
                            // 從原日期移除
                            events[date].splice(eventIndex, 1);
                            
                            // 如果原日期沒有活動了，刪除該日期
                            if (events[date].length === 0) {
                                delete events[date];
                            }
                            
                            // 添加到新日期
                            if (!events[dateStr]) {
                                events[dateStr] = [];
                            }
                            
                            events[dateStr].push({
                                id: selectedEventId,
                                title,
                                startTime,
                                endTime,
                                venues: venuesArr,
                                hostType,
                                organizer,
                                organizerPhone
                            });
                            
                            found = true;
                            break;
                        }
                    }
                }
                
                // 如果還是找不到，就當作新增處理
                if (!found) {
                    const newEvent = {
                        id: selectedEventId, // 保留原 ID
                        title,
                        startTime,
                        endTime,
                        venues: venuesArr,
                        hostType,
                        organizer,
                        organizerPhone
                    };
                    events[dateStr].push(newEvent);
                }
                
                showToast('活動已更新', 'success');
            } else {
                // 新增活動
                const newEvent = {
                    id: Date.now().toString(),
                    title,
                    startTime,
                    endTime,
                    venues: venuesArr,
                    hostType,
                    organizer,
                    organizerPhone
                };
                events[dateStr].push(newEvent);
                showToast('活動已新增', 'success');
            }
            
            // 儲存到 localStorage
            saveEvents();
            
            // 關閉表單並重新渲染日曆
            closeEventModal();
            renderCalendar();
        }
        
        // 將時間轉換為分鐘數
        function timeToMinutes(timeStr) {
            if (!timeStr || timeStr.indexOf(':') === -1) return 0;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }
        
        // 查看活動詳情
        function viewEvent(eventId, dateStr) {
            if (!eventId || !dateStr) {
                console.error('Invalid event ID or date');
                return;
            }
            
            // 保存當前日期，用於編輯時
            currentEventDate = dateStr;
            selectedEventId = eventId;
            
            if (!events[dateStr] || !Array.isArray(events[dateStr])) {
                console.error('No events found for date:', dateStr);
                return;
            }
            
            const event = events[dateStr].find(e => e && e.id === eventId);
            if (event) {
                document.getElementById('viewEventTitle').textContent = event.title || '';
                document.getElementById('viewEventHostType').textContent = event.hostType || '';
                document.getElementById('viewEventDate').textContent = formatDate(dateStr);
                document.getElementById('viewEventTime').textContent = `${event.startTime || ''} - ${event.endTime || ''}`;
                document.getElementById('viewEventVenue').textContent = Array.isArray(event.venues) ? event.venues.join(', ') : (event.venue || '');
                document.getElementById('viewEventOrganizer').textContent = event.organizer || '';
                document.getElementById('viewEventOrganizerPhone').textContent = event.organizerPhone || '';
                
                document.getElementById('viewEventModal').classList.remove('hidden');
            } else {
                console.error('Event not found:', eventId);
                showToast('找不到該活動，可能已被刪除', 'error');
            }
        }
        
        // 關閉查看活動詳情
        function closeViewEventModal() {
            document.getElementById('viewEventModal').classList.add('hidden');
        }
        
        // 編輯活動
        function editEvent() {
            if (!currentEventDate || !selectedEventId) {
                console.error('No event selected for editing');
                return;
            }
            
            if (!events[currentEventDate] || !Array.isArray(events[currentEventDate])) {
                console.error('No events found for date:', currentEventDate);
                return;
            }
            
            const event = events[currentEventDate].find(e => e && e.id === selectedEventId);
            if (event) {
                document.getElementById('eventDate').value = currentEventDate;
                document.getElementById('eventTitle').value = event.title || '';
                document.getElementById('eventStartTime').value = event.startTime || '';
                document.getElementById('eventEndTime').value = event.endTime || '';
                document.getElementById('eventOrganizer').value = event.organizer || '';
                document.getElementById('eventOrganizerPhone').value = event.organizerPhone || '';
                
                // 設置選中的場地
                selectedVenue = event.venue;
                
                closeViewEventModal();
                openEventModal(currentEventDate, true);
            } else {
                console.error('Event not found for editing:', selectedEventId);
                showToast('找不到該活動，可能已被刪除', 'error');
                closeViewEventModal();
            }
        }
        
        // 刪除活動
        function deleteEvent() {
            if (!currentEventDate || !selectedEventId) {
                console.error('No event selected for deletion');
                showToast('無法刪除：未選擇活動', 'error');
                return;
            }

            // 確保 selectedEventId 是字串
            const eventIdStr = String(selectedEventId);

            if (confirm('確定要刪除此活動嗎？')) {
                console.log('Attempting to delete event:', selectedEventId, 'from date:', currentEventDate);
                
                if (!events[currentEventDate] || !Array.isArray(events[currentEventDate])) {
                    console.error('No events array found for date:', currentEventDate);
                    showToast('找不到該日期的活動', 'error');
                    closeViewEventModal();
                    return;
                }

                // 修正：比對時強制轉為字串
                const eventIndex = events[currentEventDate].findIndex(e => e && String(e.id) === eventIdStr);
                console.log('Event index:', eventIndex);
                
                if (eventIndex !== -1) {
                    // 從數組中移除事件
                    events[currentEventDate].splice(eventIndex, 1);
                    console.log('Event removed successfully');
                    
                    // 如果該日期沒有活動了，刪除該日期
                    if (events[currentEventDate].length === 0) {
                        delete events[currentEventDate];
                        console.log('Date removed as it has no more events');
                    }
                    
                    // 儲存到 localStorage
                    saveEvents();
                    
                    closeViewEventModal();
                    renderCalendar();
                    
                    showToast('活動已成功刪除', 'success');
                } else {
                    console.error('Event not found for deletion');
                    showToast('找不到要刪除的活動', 'error');
                    closeViewEventModal();
                }
            }
        }
        
        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '';
            
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            
            const [year, month, day] = parts;
            return `${year}年${month}月${day}日`;
        }
        
        // 顯示提示訊息
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            
            // 顯示提示訊息
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            // 3秒後隱藏
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        // 匯出資料
        function exportData() {
            try {
                const dataStr = JSON.stringify(events);
                
                // 創建一個臨時的文本區域元素
                const textArea = document.createElement('textarea');
                textArea.value = dataStr;
                document.body.appendChild(textArea);
                
                // 選中並複製文本
                textArea.select();
                document.execCommand('copy');
                
                // 移除臨時元素
                document.body.removeChild(textArea);
                
                // 創建下載連結
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `教室借用資料_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                
                // 觸發下載
                link.click();
                
                // 清理
                URL.revokeObjectURL(url);
                document.body.removeChild(link);
                
                showToast('資料已匯出並複製到剪貼簿', 'success');
            } catch (error) {
                console.error('Error exporting data:', error);
                showToast('匯出資料時發生錯誤', 'error');
            }
        }
        
        // 顯示匯入對話框
        function showImportModal() {
            document.getElementById('importDataText').value = '';
            document.getElementById('importModal').classList.remove('hidden');
        }
        
        // 關閉匯入對話框
        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
        }
        
        // 匯入資料
        function importData() {
            try {
                const dataStr = document.getElementById('importDataText').value.trim();
                if (!dataStr) {
                    showToast('請輸入有效的 JSON 資料', 'error');
                    return;
                }
                
                const importedData = JSON.parse(dataStr);
                
                // 簡單驗證資料格式
                if (typeof importedData !== 'object') {
                    showToast('無效的資料格式', 'error');
                    return;
                }
                
                // 確認是否覆蓋現有資料
                if (Object.keys(events).length > 0) {
                    if (!confirm('這將覆蓋現有的所有資料，確定要繼續嗎？')) {
                        return;
                    }
                }
                
                // 更新資料
                events = importedData;
                saveEvents();
                renderCalendar();
                
                closeImportModal();
                showToast('資料已成功匯入', 'success');
            } catch (error) {
                console.error('Error importing data:', error);
                showToast('匯入資料時發生錯誤，請確保 JSON 格式正確', 'error');
            }
        }
        
        // 清除所有資料
        function clearAllData() {
            if (confirm('確定要清除所有活動資料嗎？此操作無法復原！')) {
                events = {};
                saveEvents();
                renderCalendar();
                showToast('所有資料已清除', 'success');
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', initCalendar);
    </script>
